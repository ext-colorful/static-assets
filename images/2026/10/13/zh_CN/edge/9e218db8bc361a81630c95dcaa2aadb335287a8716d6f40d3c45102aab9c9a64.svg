<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f5f4f1"/>
  <filter id="noiseFilter">
    <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.48 0 0 0 0 0.46 0 0 0 0 0.42 0 0 0 0 0.16"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
</svg>