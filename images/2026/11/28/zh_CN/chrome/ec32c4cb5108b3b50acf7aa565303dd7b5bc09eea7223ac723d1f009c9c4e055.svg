<svg xmlns="http://www.w3.org/2000/svg" viewBox="9 7 110 112" width="128" height="128">
  <defs>
    <linearGradient id="v22_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF94" />
      <stop offset="50%" stop-color="#00D4AA" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="v22_wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C853" />
      <stop offset="55%" stop-color="#0095FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="v22_leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="45%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="v22_grip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="28%" stop-color="#6EE7B7" />
      <stop offset="68%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="v22_gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="35%" stop-color="#FEF3C7" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="v22_shade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350F" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0" />
    </linearGradient>

    <clipPath id="v22_clip">
      <path d="M 10 74 A 54 54 0 0 1 118 74
               C 111 64, 100 64, 93 74
               C 85 63, 72 63, 64 74
               C 56 63, 43 63, 35 74
               C 28 64, 17 64, 10 74 Z" />
    </clipPath>

    <filter id="v22_motifShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#064E3B" flood-opacity="0.4" />
    </filter>
    <filter id="v22_drop" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#v22_drop)">
    <g>
      <rect x="60.5" y="66" width="7" height="26" fill="url(#v22_gold)" />
      <rect x="60.5" y="66" width="7" height="12" fill="url(#v22_shade)" />
      <rect x="56.5" y="89" width="15" height="3.5" rx="1.75" fill="url(#v22_gold)" />
      <path d="M 57 92.5 L 71 92.5 L 71 111 A 7 7 0 0 1 57 111 Z" fill="url(#v22_grip)" />
      <rect x="59.5" y="95" width="2.2" height="17" rx="1.1" fill="#FFFFFF" opacity="0.45" />
    </g>
    <g>
      <path d="M 58 21.5 L 59.5 12 C 60 9.5, 61.8 8, 64 8 C 66.2 8, 68 9.5, 68.5 12 L 70 21.5 Z" fill="url(#v22_grip)" />
      <rect x="56" y="19.5" width="16" height="3.2" rx="1.6" fill="url(#v22_gold)" />
      <path d="M 61.2 11.2 L 60.4 18.5" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.6" />
    </g>

    <g clip-path="url(#v22_clip)">
      <rect x="8" y="18" width="112" height="60" fill="url(#v22_bg)" />
      <path d="M 6 54 C 34 38, 64 64, 96 46 C 108 39, 116 44, 122 50 L 122 80 L 6 80 Z" fill="url(#v22_wave)" />

      
      <g transform="translate(64 46)" filter="url(#v22_motifShadow)">
        <path d="M 0 0 C -9 -6, -9 -16, 0 -13 C 9 -16, 9 -6, 0 0 Z" fill="url(#v22_leaf)" />
        <path d="M 0 0 C -9 -6, -9 -16, 0 -13 C 9 -16, 9 -6, 0 0 Z" fill="url(#v22_leaf)" transform="rotate(90)" />
        <path d="M 0 0 C -9 -6, -9 -16, 0 -13 C 9 -16, 9 -6, 0 0 Z" fill="url(#v22_leaf)" transform="rotate(180)" />
        <path d="M 0 0 C -9 -6, -9 -16, 0 -13 C 9 -16, 9 -6, 0 0 Z" fill="url(#v22_leaf)" transform="rotate(270)" />
        <circle cx="0" cy="0" r="2.8" fill="#FFFFFF" />
      </g>

      <circle cx="38" cy="40" r="2" fill="#FFFFFF" />
      <circle cx="90" cy="42" r="2" fill="#FEF08A" />
    </g>
  </g>
</svg>